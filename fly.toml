[app]
  # Change this to a unique name when launching
  app = "the-haven-chat"

[build]
  image = "node:20-alpine"

[env]
  NODE_ENV = "production"

[[services]]
  internal_port = 4001
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls"]
    port = 443

  [[services.mounts]]
    source = "data"
    destination = "/app/data"
